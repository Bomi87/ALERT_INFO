<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Alert_info</title>

  <style>
    :root {
      --bg:#0b1220;
      --panel:#111a2b;
      --panel2:#162238;
      --panel3:#0d1727;
      --border:#273753;
      --text:#f4f7fb;
      --muted:#9fb0c8;
      --accent:#75a7ff;
      --good:#75d69c;
      --warn:#ffd170;
      --bad:#ff8888;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);

      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .app {
      max-width:1220px;
      margin:0 auto;
      padding:26px 18px 60px;
    }

    .topbar {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:18px;
    }

    h1 {
      margin:0;
      font-size:26px;
    }

    .subtitle {
      margin-top:7px;
      color:var(--muted);
      font-size:13px;
    }

    button,
    input {
      font:inherit;
    }

    button {
      border:1px solid var(--border);
      background:var(--panel2);
      color:var(--text);
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
    }

    button:hover {
      filter:brightness(1.08);
    }

    button:disabled {
      opacity:.55;
      cursor:wait;
    }

    .tabs {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .tab {
      color:var(--muted);
    }

    .tab.active {
      color:#fff;
      background:#1c3254;
      border-color:#4b72aa;
    }

    .tab.other {
      margin-left:5px;
    }

    .panel {
      display:none;
    }

    .panel.active {
      display:block;
    }

    .status {
      min-height:22px;
      margin-bottom:12px;
      color:var(--muted);
      font-size:13px;
    }

    .summary {
      display:grid;
      grid-template-columns:
        repeat(4,minmax(0,1fr));
      gap:10px;
      margin-bottom:16px;
    }

    .summary-card {
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:13px;
      padding:14px;
    }

    .summary-label {
      color:var(--muted);
      font-size:12px;
    }

    .summary-value {
      margin-top:5px;
      font-size:22px;
      font-weight:800;
    }

    .grid {
      display:grid;
      grid-template-columns:
        repeat(2,minmax(0,1fr));
      gap:13px;
    }

    .entity-card {
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:15px;
      padding:16px;
    }

    .entity-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }

    .entity-code {
      font-size:22px;
      font-weight:800;
    }

    .entity-name {
      margin-top:4px;
      color:var(--muted);
      font-size:13px;
    }

    .entity-extra {
      margin-top:10px;
      color:#d4e1f3;
      font-size:13px;
      line-height:1.45;
    }

    .badge {
      display:inline-flex;
      align-items:center;
      border:1px solid var(--border);
      border-radius:999px;
      padding:5px 9px;
      font-size:12px;
      white-space:nowrap;
    }

    .badge.alert {
      color:#ffe5a9;
      background:#2d2514;
      border-color:#765d27;
    }

    .badge.none {
      color:#a7e8c2;
      background:#11271c;
      border-color:#2b6244;
    }

    .category-list {
      display:grid;
      gap:10px;
      margin-top:14px;
    }

    .category-box {
      border:1px solid var(--border);
      border-radius:11px;
      background:var(--panel3);
      overflow:hidden;
    }

    .category-title {
      padding:10px 12px;
      font-size:13px;
      font-weight:800;
      color:#d9e7fb;
      background:#132039;
      border-bottom:1px solid var(--border);
    }

    .category-alerts {
      margin:0;
      padding:0;
      list-style:none;
      counter-reset:alert-number;
    }

    .category-alert {
      position:relative;
      padding:12px 12px 12px 38px;
      border-bottom:1px solid rgba(39,55,83,.75);
      counter-increment:alert-number;
    }

    .category-alert:last-child {
      border-bottom:0;
    }

    .category-alert::before {
      content:counter(alert-number) ".";
      position:absolute;
      left:13px;
      top:12px;
      font-weight:800;
      color:var(--accent);
    }

    .alert-meta {
      color:var(--muted);
      font-size:11px;
      margin-bottom:7px;
      line-height:1.4;
    }

    .alert-note {
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      color:#dce6f3;
      font-size:12px;
      line-height:1.55;
    }

    .search-box {
      display:flex;
      gap:8px;
      margin-bottom:16px;
    }

    .search-box input {
      flex:1;
      min-width:0;
      background:#0c1525;
      border:1px solid var(--border);
      color:var(--text);
      padding:12px 13px;
      border-radius:10px;
      outline:none;
    }

    .search-box input:focus {
      border-color:var(--accent);
    }

    .empty,
    .error {
      border:1px dashed var(--border);
      border-radius:11px;
      padding:15px;
      color:var(--muted);
      margin-top:12px;
    }

    .error {
      color:#ffb3b3;
      border-color:#6e4349;
    }

    .match-list {
      display:grid;
      gap:8px;
    }

    .match-button {
      width:100%;
      text-align:left;
    }

    .note {
      margin-top:10px;
      color:var(--muted);
      font-size:11px;
      line-height:1.5;
    }

    @media(max-width:820px) {
      .summary {
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }

      .grid {
        grid-template-columns:1fr;
      }

      .topbar {
        flex-direction:column;
      }

      .tab.other {
        margin-left:0;
      }
    }
  </style>
</head>

<body>
<div class="app">

  <div class="topbar">
    <div>
      <h1>Alert_info</h1>

      <div class="subtitle">
        Airport & Country Info for Scheduled Trip
      </div>
    </div>

  </div>


  <div class="tabs">

    <button
      class="tab active"
      data-tab="airport"
    >
      Airport Alert
    </button>

    <button
      class="tab"
      data-tab="country"
    >
      Country Alert
    </button>

    <button
      class="tab other"
      data-tab="other-airport"
    >
      Other Airport
    </button>

    <button
      class="tab"
      data-tab="other-country"
    >
      Other Country
    </button>

  </div>


  <!-- Airport Alert -->
  <section
    id="panel-airport"
    class="panel active"
  >
    <div
      id="airportStatus"
      class="status"
    ></div>

    <div
      id="airportSummary"
      class="summary"
    ></div>

    <div
      id="airportGrid"
      class="grid"
    ></div>
  </section>


  <!-- Country Alert -->
  <section
    id="panel-country"
    class="panel"
  >
    <div
      id="countryStatus"
      class="status"
    ></div>

    <div
      id="countrySummary"
      class="summary"
    ></div>

    <div
      id="countryGrid"
      class="grid"
    ></div>
  </section>


  <!-- Other Airport -->
  <section
    id="panel-other-airport"
    class="panel"
  >
    <form
      id="otherAirportForm"
      class="search-box"
    >
      <input
        id="otherAirportInput"
        maxlength="4"
        autocomplete="off"
        placeholder="ICAO 예: UBBB, RJTT, KEWR"
      >

      <button type="submit">
        조회
      </button>
    </form>

    <div
      id="otherAirportStatus"
      class="status"
    ></div>

    <div id="otherAirportResult"></div>

    <div class="note">
      Other Airport는 Dashboard cache와 별도로 검색 시 해당 공항만 실시간 조회합니다.
    </div>
  </section>


  <!-- Other Country -->
  <section
    id="panel-other-country"
    class="panel"
  >
    <form
      id="otherCountryForm"
      class="search-box"
    >
      <input
        id="otherCountryInput"
        autocomplete="off"
        placeholder="예: Japan, JP, JPN, United States"
      >

      <button type="submit">
        조회
      </button>
    </form>

    <div
      id="otherCountryStatus"
      class="status"
    ></div>

    <div id="otherCountryResult"></div>

    <div class="note">
      Other Country는 검색 시 해당 국가 Alert만 실시간 조회합니다.
    </div>
  </section>

</div>


<script>
  const API_URL =
    'https://script.google.com/macros/s/AKfycbwdJw1xwLLBnALP1GxT9_2eVAAPSk13qaRKpPCUA34J8GvsOrk7ddoci0RqQna-UZlE/exec';


  let airportLoaded = false;
  let countryLoaded = false;


  function api(
    action,
    params = {}
  ) {
    return new Promise(
      (resolve,reject) => {
        const callback =
          '__gtmx_' +
          Date.now() +
          '_' +
          Math.random()
            .toString(36)
            .slice(2);

        const query =
          new URLSearchParams({
            action,
            ...params,
            callback
          });

        const script =
          document
            .createElement(
              'script'
            );

        let finished = false;

        const timer =
          setTimeout(
            () => {
              cleanup();

              reject(
                new Error(
                  'Backend 응답 시간이 초과되었습니다.'
                )
              );
            },
            45000
          );

        function cleanup() {
          if (finished) {
            return;
          }

          finished = true;
          clearTimeout(timer);

          try {
            delete window[
              callback
            ];
          } catch (_) {
            window[
              callback
            ] = undefined;
          }

          script.remove();
        }


        window[
          callback
        ] = function (data) {
          cleanup();

          if (
            !data ||
            data.success !== true
          ) {
            reject(
              new Error(
                data &&
                data.error
                  ? data.error
                  : 'Backend 오류'
              )
            );

            return;
          }

          resolve(data);
        };


        script.onerror =
          function () {
            cleanup();

            reject(
              new Error(
                'Backend 연결에 실패했습니다.'
              )
            );
          };


        script.src =
          API_URL +
          '?' +
          query.toString();

        document.head
          .appendChild(
            script
          );
      }
    );
  }


  /* ============================================================
   * MAIN AIRPORT
   * ============================================================ */

  async function loadAirportDashboard(
    force = false
  ) {
    const status =
      document.getElementById(
        'airportStatus'
      );

    const grid =
      document.getElementById(
        'airportGrid'
      );

    status.textContent =
      force
        ? 'Airport Alert 최신 조회 중...'
        : 'Airport Alert 불러오는 중...';

    grid.innerHTML = '';

    try {
      const data =
        await api(
          'airportDashboard',
          force
            ? {force:'1'}
            : {}
        );

      renderAirportSummary(
        data.summary || {}
      );

      renderAirportGrid(
        data.airports || []
      );

      status.textContent =
        formatDateTime(
          data.generatedAt
        ) +
        (
          data.fromCache
            ? ' · Cache'
            : ' · Latest'
        );

      airportLoaded = true;

    } catch (error) {
      status.textContent = '';

      grid.innerHTML =
        renderError(
          error.message
        );
    }
  }


  function renderAirportSummary(
    s
  ) {
    renderSummary(
      'airportSummary',
      [
        [
          '해외 공항',
          s.airportCount ?? '-'
        ],
        [
          'Alert 있는 공항',
          s.airportWithAlertCount
            ?? '-'
        ],
        [
          'Schedule Legs',
          s.legCount ?? '-'
        ],
        [
          'Airport Alerts',
          s.totalAlertCount ?? '-'
        ]
      ]
    );
  }


  function renderAirportGrid(
    airports
  ) {
    const grid =
      document.getElementById(
        'airportGrid'
      );

    if (!airports.length) {
      grid.innerHTML =
        `<div class="empty">
          Schedule에서 RK를 제외한 해외공항이 없습니다.
        </div>`;

      return;
    }

    grid.innerHTML =
      airports
        .map(
          renderAirportCard
        )
        .join('');
  }


  function renderAirportCard(
    item
  ) {
    if (!item.found) {
      return `
        <article class="entity-card">
          <div class="entity-head">
            <div>
              <div class="entity-code">
                ${escapeHtml(
                  item.icao
                )}
              </div>

              <div class="entity-name">
                GTMx 공항 검색 결과 없음
              </div>
            </div>

            <span class="badge">
              NOT FOUND
            </span>
          </div>
        </article>
      `;
    }

    return `
      <article class="entity-card">

        <div class="entity-head">
          <div>
            <div class="entity-code">
              ${escapeHtml(
                item.icao
              )}
            </div>

            <div class="entity-name">
              ${escapeHtml(
                item.airportName || ''
              )}
              ${
                item.iata
                  ? ` · ${escapeHtml(
                      item.iata
                    )}`
                  : ''
              }
            </div>
          </div>

          ${alertBadge(
            item.alertCount
          )}
        </div>

        <div class="entity-extra">
          ${escapeHtml(
            item.countryName || ''
          )}
          ${
            item.code3
              ? ` · ${escapeHtml(
                  item.code3
                )}`
              : ''
          }
        </div>

        ${
          Number(
            item.excludedCountryAlertCount ||
            0
          ) > 0
            ? `<div class="note">
                 Country Alert 중복 ${escapeHtml(
                   String(
                     item.excludedCountryAlertCount
                   )
                 )}건 제외
               </div>`
            : ''
        }

        ${
          item.alertError
            ? renderError(
                item.alertError
              )
            : renderCategoryGroups(
                item.alerts
              )
        }

      </article>
    `;
  }


  /* ============================================================
   * MAIN COUNTRY
   * ============================================================ */

  async function loadCountryDashboard(
    force = false
  ) {
    const status =
      document.getElementById(
        'countryStatus'
      );

    const grid =
      document.getElementById(
        'countryGrid'
      );

    status.textContent =
      force
        ? 'Country Alert 최신 조회 중...'
        : 'Country Alert 불러오는 중...';

    grid.innerHTML = '';

    try {
      const data =
        await api(
          'countryDashboard',
          force
            ? {force:'1'}
            : {}
        );

      renderCountrySummary(
        data.summary || {}
      );

      renderCountryGrid(
        data.countries || []
      );

      status.textContent =
        formatDateTime(
          data.generatedAt
        ) +
        (
          data.fromCache
            ? ' · Cache'
            : ' · Latest'
        );

      countryLoaded = true;

    } catch (error) {
      status.textContent = '';

      grid.innerHTML =
        renderError(
          error.message
        );
    }
  }


  function renderCountrySummary(
    s
  ) {
    renderSummary(
      'countrySummary',
      [
        [
          '고유 국가',
          s.countryCount ?? '-'
        ],
        [
          'Alert 있는 국가',
          s.countryWithAlertCount
            ?? '-'
        ],
        [
          'Country Alerts',
          s.totalAlertCount ?? '-'
        ],

      ]
    );
  }


  function renderCountryGrid(
    countries
  ) {
    const grid =
      document.getElementById(
        'countryGrid'
      );

    if (!countries.length) {
      grid.innerHTML =
        `<div class="empty">
          Schedule 해외공항에서 확인된 국가가 없습니다.
        </div>`;

      return;
    }

    grid.innerHTML =
      countries
        .map(
          renderCountryCard
        )
        .join('');
  }


  function renderCountryCard(
    item
  ) {
    return `
      <article class="entity-card">

        <div class="entity-head">
          <div>
            <div class="entity-code">
              ${escapeHtml(
                item.countryName || ''
              )}
            </div>

            <div class="entity-name">
              ${escapeHtml(
                item.code || ''
              )}
              ${
                item.code3
                  ? ` · ${escapeHtml(
                      item.code3
                    )}`
                  : ''
              }
            </div>
          </div>

          ${alertBadge(
            item.alertCount
          )}
        </div>

        <div class="entity-extra">
          Schedule Airports:
          ${escapeHtml(
            (item.airports || [])
              .join(', ')
          )}
        </div>

        ${
          item.alertError
            ? renderError(
                item.alertError
              )
            : renderCategoryGroups(
                item.alerts
              )
        }

      </article>
    `;
  }


  /* ============================================================
   * OTHER AIRPORT
   * ============================================================ */

  async function searchOtherAirport() {
    const input =
      document.getElementById(
        'otherAirportInput'
      );

    const status =
      document.getElementById(
        'otherAirportStatus'
      );

    const result =
      document.getElementById(
        'otherAirportResult'
      );

    const icao =
      input.value
        .trim()
        .toUpperCase();

    if (
      !/^[A-Z0-9]{4}$/
        .test(icao)
    ) {
      result.innerHTML =
        renderError(
          'ICAO 공항코드 4자리를 입력하세요.'
        );

      return;
    }

    status.textContent =
      `${icao} 실시간 조회 중...`;

    result.innerHTML = '';

    try {
      const data =
        await api(
          'otherAirport',
          {icao}
        );

      if (!data.found) {
        result.innerHTML =
          `<div class="empty">
            ${escapeHtml(icao)}
            공항을 찾지 못했습니다.
          </div>`;

        return;
      }

      result.innerHTML =
        renderAirportCard({
          ...data.airport,
          found:true,
          alertCount:
            data.alertCount || 0,
          alerts:
            data.alerts || [],
          excludedCountryAlertCount:
            data.excludedCountryAlertCount || 0,
          alertError:
            data.alertError || '',
          countryFilterWarning:
            data.countryFilterWarning || ''
        });

    } catch (error) {
      result.innerHTML =
        renderError(
          error.message
        );

    } finally {
      status.textContent = '';
    }
  }


  /* ============================================================
   * OTHER COUNTRY
   * ============================================================ */

  async function searchOtherCountry(
    overrideQuery
  ) {
    const input =
      document.getElementById(
        'otherCountryInput'
      );

    const status =
      document.getElementById(
        'otherCountryStatus'
      );

    const result =
      document.getElementById(
        'otherCountryResult'
      );

    const query =
      String(
        overrideQuery != null
          ? overrideQuery
          : input.value
      ).trim();

    if (!query) {
      result.innerHTML =
        renderError(
          '국가명 또는 국가코드를 입력하세요.'
        );

      return;
    }

    input.value = query;

    status.textContent =
      `${query} 실시간 조회 중...`;

    result.innerHTML = '';

    try {
      const data =
        await api(
          'otherCountry',
          {
            country:query
          }
        );

      if (!data.found) {
        const matches =
          data.matches || [];

        if (!matches.length) {
          result.innerHTML =
            `<div class="empty">
              일치하는 국가가 없습니다.
            </div>`;

          return;
        }

        result.innerHTML = `
          <div class="match-list">
            ${matches
              .map(
                item => `
                  <button
                    type="button"
                    class="match-button"
                    data-country-id="${escapeAttr(
                      String(
                        item.countryId ||
                        ''
                      )
                    )}"
                  >
                    ${escapeHtml(
                      item.name
                    )}
                    ·
                    ${escapeHtml(
                      item.code || ''
                    )}
                    /
                    ${escapeHtml(
                      item.code3 || ''
                    )}
                  </button>
                `
              )
              .join('')}
          </div>
        `;

        result
          .querySelectorAll(
            '[data-country-id]'
          )
          .forEach(
            button => {
              button
                .addEventListener(
                  'click',
                  () => {
                    searchOtherCountry(
                      button
                        .dataset
                        .countryId
                    );
                  }
                );
            }
          );

        return;
      }

      result.innerHTML =
        renderOtherCountryCard(
          data
        );

    } catch (error) {
      result.innerHTML =
        renderError(
          error.message
        );

    } finally {
      status.textContent = '';
    }
  }


  function renderOtherCountryCard(
    data
  ) {
    const item =
      data.country || {};

    return `
      <article class="entity-card">

        <div class="entity-head">
          <div>
            <div class="entity-code">
              ${escapeHtml(
                item.countryName || ''
              )}
            </div>

            <div class="entity-name">
              ${escapeHtml(
                item.code || ''
              )}
              ${
                item.code3
                  ? ` · ${escapeHtml(
                      item.code3
                    )}`
                  : ''
              }
            </div>
          </div>

          ${alertBadge(
            data.alertCount
          )}
        </div>

        ${
          data.alertError
            ? renderError(
                data.alertError
              )
            : renderCategoryGroups(
                data.alerts
              )
        }

      </article>
    `;
  }


  /* ============================================================
   * CATEGORY GROUP RENDER
   * ============================================================ */

  function renderCategoryGroups(
    alerts
  ) {
    /*
     * Category 이름 하드코딩 X
     *
     * 각 Alert의 categories[]를 실제 데이터 그대로 읽는다.
     *
     * 예:
     * A = ["Flight Planning","Runway","ATC"]
     * B = ["Flight Planning","ATC"]
     *
     * B는 A의 부분집합이므로 별도 그룹을 만들지 않고
     * 화면에는 아래처럼 한 그룹으로 표시:
     *
     * Flight Planning, Runway, ATC
     * 1. ...
     * 2. ...
     * 3. ...
     *
     * 공항/국가마다 categories가 달라도 자동 대응.
     */
    const groups =
      groupAlertsByLargestCategorySet(
        alerts || []
      );

    if (!groups.length) {
      return `
        <div class="empty">
          현재 Alert 없음
        </div>
      `;
    }

    return `
      <div class="category-list">
        ${groups
          .map(
            group =>
              renderCategoryBox(
                group.title,
                group.alerts
              )
          )
          .join('')}
      </div>
    `;
  }


  function renderCategoryBox(
    category,
    alerts
  ) {
    return `
      <section class="category-box">

        <div class="category-title">
          ${escapeHtml(
            category
          )}
        </div>

        <ol class="category-alerts">
          ${alerts
            .map(
              alert => `
                <li class="category-alert">

                  <div class="alert-meta">
                    ${renderAlertMeta(
                      alert
                    )}
                  </div>

                  <div class="alert-note">${escapeHtml(
                    alert.noteText || ''
                  )}</div>

                </li>
              `
            )
            .join('')}
        </ol>

      </section>
    `;
  }


  /**
   * Alert의 category 배열을 trim + 중복 제거.
   * 이름 자체는 하드코딩하지 않는다.
   */
  function getAlertCategoryArray(
    alert
  ) {
    const raw =
      alert &&
      Array.isArray(
        alert.categories
      )
        ? alert.categories
        : [];

    const seen = new Set();

    return raw
      .map(
        value =>
          String(
            value || ''
          ).trim()
      )
      .filter(
        value => {
          if (
            !value ||
            seen.has(value)
          ) {
            return false;
          }

          seen.add(value);
          return true;
        }
      );
  }


  function makeCategorySetKey(
    categories
  ) {
    // 조합 비교용 key는 순서 영향 제거.
    return [...categories]
      .map(
        x => x.toLowerCase()
      )
      .sort()
      .join('||');
  }


  function isCategorySubset(
    smaller,
    larger
  ) {
    if (
      smaller.length >
      larger.length
    ) {
      return false;
    }

    const largeSet =
      new Set(
        larger.map(
          x => x.toLowerCase()
        )
      );

    return smaller.every(
      x =>
        largeSet.has(
          x.toLowerCase()
        )
    );
  }


  /**
   * 가장 큰 category 조합을 상위 그룹으로 사용.
   * 작은 조합이 큰 조합의 부분집합이면 큰 그룹 아래로 합친다.
   *
   * 동일 크기의 서로 다른 조합은 별도 그룹.
   *
   * 하나의 작은 조합이 여러 큰 조합의 부분집합일 경우:
   * - category 수가 가장 많은 그룹 우선
   * - 동일하면 GTMx 응답에서 먼저 등장한 그룹 우선
   *
   * 모든 Alert는 정확히 한 그룹에만 들어간다.
   */
  function groupAlertsByLargestCategorySet(
    alerts
  ) {
    const source =
      (alerts || [])
        .map(
          (alert,index) => ({
            alert,
            index,
            categories:
              getAlertCategoryArray(
                alert
              )
          })
        );

    if (!source.length) {
      return [];
    }

    // category 없는 Alert도 자동으로 Other 처리
    source.forEach(
      item => {
        if (
          !item.categories.length
        ) {
          item.categories = [
            'Other'
          ];
        }
      }
    );

    // 실제 등장한 고유 category 조합 수집
    const comboMap =
      new Map();

    source.forEach(
      item => {
        const key =
          makeCategorySetKey(
            item.categories
          );

        if (
          !comboMap.has(key)
        ) {
          comboMap.set(
            key,
            {
              key,
              categories:
                item.categories,
              firstIndex:
                item.index
            }
          );
        }
      }
    );

    const combos =
      [...comboMap.values()];

    /*
     * 최상위 조합:
     * 다른 실제 조합의 strict subset이 아닌 조합.
     *
     * 예:
     * ["Flight Planning","Runway","ATC"]
     * ["Flight Planning","ATC"]
     *
     * 두 번째는 첫 번째의 subset이므로
     * 최상위 그룹은 첫 번째만 남음.
     */
    const parents =
      combos.filter(
        combo =>
          !combos.some(
            other =>
              other.key !==
                combo.key &&
              other.categories.length >
                combo.categories.length &&
              isCategorySubset(
                combo.categories,
                other.categories
              )
          )
      );

    // GTMx에서 처음 등장한 상위 그룹 순서 유지
    parents.sort(
      (a,b) =>
        a.firstIndex -
        b.firstIndex
    );

    const groups =
      parents.map(
        parent => ({
          key:
            parent.key,

          // 표시명은 실제 GTMx categories[] 순서를 그대로 사용
          title:
            parent.categories
              .join(', '),

          categories:
            parent.categories,

          firstIndex:
            parent.firstIndex,

          alerts: []
        })
      );

    // 각 Alert를 자신을 포함하는 가장 큰 상위 그룹 하나에 배정
    source.forEach(
      item => {
        const candidates =
          groups
            .filter(
              group =>
                isCategorySubset(
                  item.categories,
                  group.categories
                )
            )
            .sort(
              (a,b) => {
                // 더 큰 category 조합 우선
                if (
                  b.categories.length !==
                  a.categories.length
                ) {
                  return (
                    b.categories.length -
                    a.categories.length
                  );
                }

                // 같으면 먼저 등장한 실제 그룹
                return (
                  a.firstIndex -
                  b.firstIndex
                );
              }
            );

        let target =
          candidates[0];

        // 방어적 fallback
        if (!target) {
          target = {
            key:
              makeCategorySetKey(
                item.categories
              ),
            title:
              item.categories
                .join(', '),
            categories:
              item.categories,
            firstIndex:
              item.index,
            alerts: []
          };

          groups.push(target);
        }

        target.alerts.push(
          item.alert
        );
      }
    );

    /*
     * 모든 화면 공통 정렬:
     * 1) 각 category group 내부 Alert를 startDate 최신순으로 정렬
     * 2) category group 자체도 그 그룹의 최신 Alert 날짜 기준 최신순 정렬
     *
     * 적용 대상:
     * - Airport Alert
     * - Country Alert
     * - Other Airport
     * - Other Country
     */

    function alertTime(alert) {
      if (
        !alert ||
        !alert.startDate
      ) {
        return 0;
      }

      const time =
        new Date(
          alert.startDate
        ).getTime();

      return Number.isFinite(time)
        ? time
        : 0;
    }

    groups.forEach(
      group => {
        group.alerts.sort(
          (a,b) =>
            alertTime(b) -
            alertTime(a)
        );

        group.latestTime =
          group.alerts.length
            ? alertTime(
                group.alerts[0]
              )
            : 0;
      }
    );

    groups.sort(
      (a,b) => {
        if (
          b.latestTime !==
          a.latestTime
        ) {
          return (
            b.latestTime -
            a.latestTime
          );
        }

        return (
          a.firstIndex -
          b.firstIndex
        );
      }
    );

    return groups;
  }


  function renderAlertMeta(
    alert
  ) {
    const parts = [];

    if (
      alert.startDate ||
      alert.endDate
    ) {
      parts.push(
        [
          alert.startDate || '',
          alert.endDate
            ? `~ ${alert.endDate}`
            : 'Not Available'
        ]
          .filter(Boolean)
          .join(' ')
      );
    }

    if (
      alert.types &&
      alert.types.length
    ) {
      parts.push(
        alert.types.join(', ')
      );
    }

    if (
      alert.alertId
    ) {
      parts.push(
        `ID ${alert.alertId}`
      );
    }

    return escapeHtml(
      parts.join(' · ')
    );
  }


  /* ============================================================
   * COMMON UI
   * ============================================================ */

  function alertBadge(
    count
  ) {
    const n =
      Number(count || 0);

    return n > 0
      ? `<span class="badge alert">
           ALERT ${n}
         </span>`
      : `<span class="badge none">
           NO ALERT
         </span>`;
  }


  function renderSummary(
    elementId,
    items
  ) {
    document
      .getElementById(
        elementId
      )
      .innerHTML =
        items
          .map(
            ([label,value]) => `
              <div class="summary-card">

                <div class="summary-label">
                  ${escapeHtml(
                    label
                  )}
                </div>

                <div class="summary-value">
                  ${escapeHtml(
                    String(value)
                  )}
                </div>

              </div>
            `
          )
          .join('');
  }


  function switchTab(
    name
  ) {
    document
      .querySelectorAll(
        '.tab'
      )
      .forEach(
        el => {
          el.classList
            .toggle(
              'active',
              el.dataset.tab ===
                name
            );
        }
      );

    document
      .querySelectorAll(
        '.panel'
      )
      .forEach(
        el => {
          el.classList
            .toggle(
              'active',
              el.id ===
                `panel-${name}`
            );
        }
      );

    if (
      name === 'airport' &&
      !airportLoaded
    ) {
      loadAirportDashboard(
        false
      );
    }

    if (
      name === 'country' &&
      !countryLoaded
    ) {
      loadCountryDashboard(
        false
      );
    }
  }


  function renderError(
    message
  ) {
    return `
      <div class="error">
        ${escapeHtml(
          message || '오류'
        )}
      </div>
    `;
  }


  function formatDateTime(
    value
  ) {
    if (!value) {
      return '';
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return value;
    }

    return new Intl
      .DateTimeFormat(
        'ko-KR',
        {
          year:'numeric',
          month:'2-digit',
          day:'2-digit',
          hour:'2-digit',
          minute:'2-digit',
          second:'2-digit',
          hour12:false
        }
      )
      .format(date);
  }


  function escapeHtml(
    value
  ) {
    return String(
      value ?? ''
    )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#39;'
      );
  }


  function escapeAttr(
    value
  ) {
    return escapeHtml(
      value
    )
      .replace(
        /`/g,
        '&#96;'
      );
  }


  /* ============================================================
   * EVENTS
   * ============================================================ */

  document
    .querySelectorAll(
      '.tab'
    )
    .forEach(
      button => {
        button
          .addEventListener(
            'click',
            () => {
              switchTab(
                button
                  .dataset
                  .tab
              );
            }
          );
      }
    );


  document
    .getElementById(
      'otherAirportForm'
    )
    .addEventListener(
      'submit',
      event => {
        event.preventDefault();
        searchOtherAirport();
      }
    );


  document
    .getElementById(
      'otherAirportInput'
    )
    .addEventListener(
      'input',
      event => {
        event.target.value =
          event.target.value
            .toUpperCase()
            .replace(
              /[^A-Z0-9]/g,
              ''
            )
            .slice(0,4);
      }
    );


  document
    .getElementById(
      'otherCountryForm'
    )
    .addEventListener(
      'submit',
      event => {
        event.preventDefault();
        searchOtherCountry();
      }
    );


  // 최초 화면
  loadAirportDashboard(
    false
  );
</script>
</body>
</html>
